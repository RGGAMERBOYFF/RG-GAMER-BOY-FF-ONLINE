<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<meta name="description" content="Sign in to RG GAMER BOY FF using Google or continue as a guest.">
<title>RG GAMER BOY FF | Login</title>
<style>
:root{--red:#c51f2b;--dark:#171717;--muted:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;font-family:Arial,sans-serif;color:#171717;background:radial-gradient(circle at top,#54151c,#171717 62%)}
.card{width:min(100%,460px);background:#fff;border-radius:22px;padding:clamp(24px,6vw,38px);box-shadow:0 24px 80px #0006}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:13px;background:var(--red);color:#fff;font-size:20px;font-weight:900}.brand h1{font-size:clamp(17px,4vw,22px);margin:0;letter-spacing:.3px}
.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--red);font-weight:800}
h2{font-size:clamp(26px,6vw,34px);line-height:1.2;margin:9px 0 12px}p{color:var(--muted);line-height:1.6;font-size:15px}
.actions{display:grid;gap:12px;margin-top:25px}
button{width:100%;min-height:52px;border-radius:11px;padding:13px 16px;font-size:16px;font-weight:800;cursor:pointer}
.google{background:#fff;border:1px solid #d1d5db;color:#171717;display:flex;align-items:center;justify-content:center;gap:11px}
.google-mark{font-weight:900;font-size:20px;color:#4285f4}
.guest{border:0;background:var(--red);color:#fff}
button:disabled{opacity:.6;cursor:wait}
.status{min-height:22px;margin-top:16px;font-size:13px;line-height:1.5;text-align:center;color:#b91c1c;overflow-wrap:anywhere}
.note{font-size:12px;text-align:center;border-top:1px solid var(--line);padding-top:16px;margin-top:20px}
</style>
</head>
<body>
<main class="card">
 <div class="brand"><div class="logo">RG</div><h1>RG GAMER BOY FF</h1></div>
 <div class="eyebrow">Welcome back</div>
 <h2>Choose how to continue</h2>
 <p>Sign in with your Google account, or enter the website as a guest. Guest access does not require a Google account.</p>
 <div class="actions">
  <button id="googleBtn" class="google" type="button"><span class="google-mark" aria-hidden="true">G</span><span>Continue with Google</span></button>
  <button id="guestBtn" class="guest" type="button">Continue as Guest</button>
 </div>
 <div id="status" class="status" role="status" aria-live="polite"></div>
 <p class="note">Your sign-in is handled by Firebase Authentication. Never share your password or verification codes.</p>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithRedirect, signInAnonymously, getRedirectResult, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTyYnD3BuGscMsajttDmO1uHdCBxACVyM",
  authDomain: "rg-gamer-boy-backend.firebaseapp.com",
  databaseURL: "https://rg-gamer-boy-backend-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rg-gamer-boy-backend",
  storageBucket: "rg-gamer-boy-backend.firebasestorage.app",
  messagingSenderId: "1064165237495",
  appId: "1:1064165237495:web:cb2fed75dfc844509e69f2",
  measurementId: "G-XFJ3DKTG97"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
getDatabase(app);
const provider = new GoogleAuthProvider();
const googleBtn = document.getElementById("googleBtn");
const guestBtn = document.getElementById("guestBtn");
const statusBox = document.getElementById("status");
let redirecting = false;

function setBusy(busy, message="") {
  googleBtn.disabled = busy;
  guestBtn.disabled = busy;
  statusBox.textContent = message;
}
function enterMain() { window.location.replace("./main.html"); }

try {
  const result = await getRedirectResult(auth);
  if (result && result.user) enterMain();
} catch (error) {
  console.error("Google sign-in redirect error:", error);
  statusBox.textContent = readableError(error);
}
onAuthStateChanged(auth, user => {
  if (user && !redirecting) enterMain();
});
googleBtn.addEventListener("click", async () => {
  redirecting = true;
  setBusy(true, "Opening Google sign-in…");
  try {
    await signInWithRedirect(auth, provider);
  } catch (error) {
    redirecting = false;
    setBusy(false, readableError(error));
  }
});
guestBtn.addEventListener("click", async () => {
  setBusy(true, "Creating guest session…");
  try {
    await signInAnonymously(auth);
    enterMain();
  } catch (error) {
    setBusy(false, readableError(error));
  }
});
function readableError(error) {
  const messages = {
    "auth/unauthorized-domain": "This website domain is not authorized yet. Add it in Firebase Authentication → Settings → Authorized domains.",
    "auth/operation-not-allowed": "This sign-in method is not enabled. Turn on Google and Anonymous sign-in in Firebase Authentication.",
    "auth/network-request-failed": "Network problem. Check your internet connection and try again.",
    "auth/popup-blocked": "The browser blocked sign-in. Allow redirects/pop-ups and try again."
  };
  return messages[error?.code] || `Sign-in failed: ${error?.message || "Please try again."}`;
}
</script>
</body>
</html>
