<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getDatabase } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBJaK5nZMMMeCM8OaQyQcmVLcjkFDAaFHI",
  authDomain: "rg-gamer-boy-auth.firebaseapp.com",
  databaseURL: "https://rg-gamer-boy-auth-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rg-gamer-boy-auth",
  storageBucket: "rg-gamer-boy-auth.firebasestorage.app",
  messagingSenderId: "160248868945",
  appId: "1:160248868945:web:1a66b48f845df318d7c870",
  measurementId: "G-X26078GV4L"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);
getDatabase(app);
const guestBtn = document.getElementById("guestBtn");
const statusBox = document.getElementById("status");
let signingIn = false;

function setBusy(busy, message="") {
  guestBtn.disabled = busy;
  statusBox.textContent = message;
}
function enterMain() { window.location.replace("./main.html"); }
function readableError(error) {
  const messages = {
    "auth/unauthorized-domain": "This website domain is not authorized. In Firebase Authentication → Settings → Authorized domains, add the exact host shown in your browser address bar.",
    "auth/invalid-api-key": "Firebase API key does not match this project. Check the Web app config.",
    "auth/network-request-failed": "Network problem. Check your internet connection and try again.",
    "auth/popup-blocked": "Google sign-in was blocked by the browser. Try again in Chrome.",
    "auth/popup-closed-by-user": "Google sign-in was closed before finishing. Try again.",
    "auth/cancelled-popup-request": "Google sign-in was interrupted. Try again."
  };
  return messages[error?.code] || `Sign-in failed: ${error?.message || "Please try again."}`;
}

// Restore an existing authenticated session and continue to the main website.
onAuthStateChanged(auth, user => {
  if (user) {
    statusBox.textContent = "Login successful. Opening your website…";
    enterMain();
  }
});

guestBtn.addEventListener("click", async () => {
  if (signingIn) return;
  signingIn = true;
  setBusy(true, "Continuing as guest…");
  try {
    await signInAnonymously(auth);
    enterMain();
  } catch (error) {
    console.error("Guest sign-in error:", error);
    signingIn = false;
    setBusy(false, readableError(error));
  }
});
</script>
