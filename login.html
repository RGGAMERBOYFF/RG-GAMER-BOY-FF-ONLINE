<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b12">
<title>RG GAMER BOY FF | Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a12;--panel:#111827;--line:#263247;--cyan:#22d3ee;--blue:#2563eb;--muted:#a7b2c5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0%,#172b4a 0%,#0b1220 42%,var(--bg) 78%);font-family:"Exo 2",Arial,sans-serif;color:#fff}
.wrap{width:min(100%,430px);text-align:center}.mark{width:76px;height:76px;margin:0 auto 20px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#0e7490,#1d4ed8);box-shadow:0 0 35px #06b6d455;font:800 25px Orbitron,sans-serif;border:1px solid #67e8f9}
h1{font:800 clamp(22px,6vw,30px) Orbitron,sans-serif;letter-spacing:1px;margin:0 0 9px;text-shadow:0 0 22px #22d3ee55}
.sub{color:var(--muted);margin:0 0 28px;font-size:14px;letter-spacing:1.5px}
.panel{padding:27px 22px 22px;background:linear-gradient(145deg,#111827f5,#0d1422f5);border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 70px #0008}
.panel h2{font:700 17px Orbitron,sans-serif;margin:0 0 20px}
.action{width:100%;min-height:57px;border:1px solid #3b4a61;border-radius:13px;margin:0 0 13px;padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:12px;font:700 16px "Exo 2",sans-serif;cursor:pointer;transition:.2s}
.action:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 8px 25px #06b6d422}
.google{background:#f8fafc;color:#172033}.guest{background:linear-gradient(100deg,#0e7490,#1d4ed8);color:white;border-color:#38bdf8;margin-bottom:0}
.gicon{font-weight:900;font-size:19px;color:#4285f4;background:white;border-radius:50%;width:25px;height:25px;display:grid;place-items:center}
.guesticon{font-size:20px}.note{font-size:12px;color:#91a0b6;margin:17px 0 0;line-height:1.5}
.status{min-height:20px;margin:14px 0 0;color:#fca5a5;font-size:13px}.hidden{display:none!important}
.continue{background:linear-gradient(100deg,#0891b2,#2563eb);color:#fff;border-color:#38bdf8;font:800 17px Orbitron,sans-serif}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid #ffffff66;border-top-color:white;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:360px){.panel{padding:23px 16px}.action{font-size:15px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="mark" aria-hidden="true">RG</div>
  <h1>RG GAMER BOY FF</h1>
  <p class="sub">WELCOME TO THE GAMING WORLD</p>
  <section class="panel" aria-live="polite">
    <h2 id="heading">Choose how to continue</h2>
    <div id="loginChoices">
      <button class="action google" id="googleBtn" type="button"><span class="gicon">G</span>Continue with Google</button>
      <button class="action guest" id="guestBtn" type="button"><span class="guesticon">👤</span>Continue with Guest</button>
    </div>
    <div id="returnChoices" class="hidden">
      <button class="action continue" id="continueBtn" type="button">CONTINUE&nbsp; →</button>
    </div>
    <p class="note">Google sign-in is handled securely by Google and Firebase. We never ask for your Google password on this page.</p>
    <p class="status" id="status" role="status"></p>
  </section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
  getRedirectResult, signInAnonymously, onAuthStateChanged,
  setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD6hyR4O5Sfb3VWLq5k7RLtoKifI7aiLf8",
  authDomain: "rg-gamer-boy-ff-79de8.firebaseapp.com",
  databaseURL: "https://rg-gamer-boy-ff-79de8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rg-gamer-boy-ff-79de8",
  storageBucket: "rg-gamer-boy-ff-79de8.firebasestorage.app",
  messagingSenderId: "699276161086",
  appId: "1:699276161086:web:38531927307cddcc08a16f",
  measurementId: "G-TRX2QKQFQF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

const statusEl = document.getElementById("status");
const loginChoices = document.getElementById("loginChoices");
const returnChoices = document.getElementById("returnChoices");
const heading = document.getElementById("heading");
let authReady = false;
let redirectHandled = false;

function message(text, error=false) {
  statusEl.textContent = text;
  statusEl.style.color = error ? "#fca5a5" : "#86efac";
}
function busy(button, text) {
  button.disabled = true;
  button.dataset.oldText = button.innerHTML;
  button.innerHTML = '<span class="spinner"></span>' + text;
}
function restore(button) {
  button.disabled = false;
  if (button.dataset.oldText) button.innerHTML = button.dataset.oldText;
}
function goToWebsite() {
  window.location.replace("index.html");
}

await setPersistence(auth, browserLocalPersistence);

try {
  const result = await getRedirectResult(auth);
  if (result?.user) goToWebsite();
} catch (e) {
  message("Google sign-in could not be completed: " + (e.message || e.code), true);
}

onAuthStateChanged(auth, (user) => {
  authReady = true;
  if (user) {
    heading.textContent = "You're already signed in";
    loginChoices.classList.add("hidden");
    returnChoices.classList.remove("hidden");
    message("Your login is saved on this browser.");
  } else {
    heading.textContent = "Choose how to continue";
    loginChoices.classList.remove("hidden");
    returnChoices.classList.add("hidden");
  }
});

document.getElementById("googleBtn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  busy(btn, "Connecting to Google…");
  message("");
  try {
    await signInWithPopup(auth, provider);
    goToWebsite();
  } catch (err) {
    if (err.code === "auth/popup-blocked" || err.code === "auth/operation-not-supported-in-this-environment") {
      try { await signInWithRedirect(auth, provider); return; }
      catch (redirectErr) { message("Google sign-in error: " + (redirectErr.message || redirectErr.code), true); }
    } else {
      message("Google sign-in error: " + (err.message || err.code), true);
    }
    restore(btn);
  }
});

document.getElementById("guestBtn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  busy(btn, "Signing in as guest…");
  message("");
  try {
    await signInAnonymously(auth);
    goToWebsite();
  } catch (err) {
    message("Guest sign-in error: " + (err.message || err.code) + ". Check that Anonymous is enabled in Firebase Authentication.", true);
    restore(btn);
  }
});

document.getElementById("continueBtn").addEventListener("click", () => {
  if (auth.currentUser) goToWebsite();
  else {
    message("Your session has expired. Please sign in again.", true);
    loginChoices.classList.remove("hidden");
    returnChoices.classList.add("hidden");
  }
});
</script>
</body>
</html>
