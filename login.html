const RECAPTCHA_VERIFY_URL="https://script.google.com/macros/s/AKfycbzM3UEJc6ASfg2hlL8yMkcIdJx0bsjIjNCiWg_7CpuFKZuBGLIEmmBCj8tEzS71YS6V/exec";
const auth=getAuth(initializeApp(firebaseConfig));await setPersistence(auth,browserLocalPersistence);
const $=id=>document.getElementById(id);
const usernameEmail=u=>u.trim().toLowerCase()+"@username.rggamerboyff.invalid";

function verifyCaptchaWithAppsScript(token){
 return new Promise((resolve,reject)=>{
  const callbackName="rgCaptchaCallback_"+Date.now()+"_"+Math.floor(Math.random()*100000);
  const script=document.createElement("script");
  let finished=false;
  const cleanup=()=>{delete window[callbackName];script.remove();clearTimeout(timer);};
  const done=(fn,value)=>{if(finished)return;finished=true;cleanup();fn(value);};
  window[callbackName]=(data)=>done(resolve,data);
  script.onerror=()=>done(reject,new Error("Could not load the Google verification endpoint. Check the Apps Script deployment URL."));
  script.src=RECAPTCHA_VERIFY_URL+"?callback="+encodeURIComponent(callbackName)+"&token="+encodeURIComponent(token);
  const timer=setTimeout(()=>done(reject,new Error("Google verification timed out. Please try again.")),15000);
  document.head.appendChild(script);
 });
}
onAuthStateChanged(auth,user=>{$("createArea").classList.toggle("hidden",!!user);$("welcomeArea").classList.toggle("hidden",!user)});
$("createForm").addEventListener("submit",async e=>{
 e.preventDefault();$("message").textContent="";
 const u=$("username").value.trim(),p=$("password").value;
 if(!/^[A-Za-z0-9_]{5,12}$/.test(u))return $("message").textContent="Username must be 5–12 characters (letters, numbers, or underscore).";
 if(p.length<8||p.length>15)return $("message").textContent="Password must be 8–15 characters.";
 if(p!==$("confirm").value)return $("message").textContent="Passwords do not match.";
 const token=window.grecaptcha?.getResponse?.() || "";
 if(!token)return $("message").textContent="Please complete the security check.";
 $("createBtn").disabled=true;
 try{

  if(result.success!==true) throw new Error("Security verification failed. Please refresh the page and try again.");
  await createUserWithEmailAndPassword(auth,usernameEmail(u),p);
 }catch(err){
  const code=err.code||"";
  $("message").textContent=code==="auth/email-already-in-use"?"This username is already taken.":code==="auth/invalid-api-key"?"Firebase API key is invalid. Update the Firebase configuration.":code==="auth/operation-not-allowed"?"Enable Email/Password sign-in in Firebase Authentication.":code==="auth/network-request-failed"?"Cannot connect to Firebase. Check Firebase configuration and authorized domains.":err.message||"Account creation failed. Please try again.";
 }
