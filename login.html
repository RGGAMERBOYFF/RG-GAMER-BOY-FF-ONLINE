<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b18"><title>Welcome | RG GAMER BOY FF</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 15%,#34206c,transparent 38%),radial-gradient(circle at 85% 80%,#651c35,transparent 36%),#080b18;color:white;font-family:Arial,sans-serif}.card{width:min(100%,430px);padding:26px;border:1px solid #ffffff26;border-radius:22px;background:#101629ed;box-shadow:0 22px 70px #0009;text-align:center}.brandimg{width:140px;height:140px;max-width:55%;object-fit:contain;border-radius:18px;margin:0 auto 14px;display:block}h1{font-size:clamp(22px,6vw,30px);margin:8px 0;letter-spacing:1px}p{color:#b9c3dc;font-size:14px;line-height:1.5}.submit,.continue{border:0;border-radius:10px;padding:13px;font-weight:800;cursor:pointer}input{width:100%;padding:14px;margin:8px 0;border:1px solid #394663;border-radius:10px;background:#080f20;color:white;font-size:16px;outline:none}input:focus{border-color:#9a7bff}.submit,.continue{width:100%;margin-top:12px;background:linear-gradient(100deg,#7546ed,#d12e75);color:white;font-size:16px}.small{font-size:12px;color:#98a6c5}.error{color:#ff8f9e;min-height:22px;font-size:13px}.hidden{display:none!important}
</style></head><body><main class="card">
<img class="brandimg" src="https://i.supaimg.com/cc740f2b-876c-4dd7-bbf2-16d636413b82/85320e1a-9a75-4178-90bb-a7f01267a661.png" alt="RG GAMER BOY FF Official">
<h1 id="pageTitle">Welcome</h1>
<p id="pageSubtitle">Create your account to continue.</p>
<section id="authArea">
<form id="authForm">
<input id="username" autocomplete="username" minlength="5" maxlength="12" placeholder="Username (5–12 characters)" required>
<input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="15" placeholder="Password (8–15 characters)" required>
<input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="15" placeholder="Confirm Password" required>
<button class="submit" id="submitBtn" type="submit">Create Account</button>
</form>
<p class="small">Username: 5–12 characters (letters, numbers, or underscore). Password: 8–15 characters.</p>
</section>
<section id="continueArea" class="hidden">
<button class="continue" id="continueBtn" type="button">Continue</button>
</section>
<div class="error" id="message" role="status" aria-live="polite"></div>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import{getAuth,setPersistence,browserLocalPersistence,createUserWithEmailAndPassword,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyD6hyR4O5Sfb3VWLq5k7RLtoKifI7aiLf8",authDomain:"rg-gamer-boy-ff-79de8.firebaseapp.com",databaseURL:"https://rg-gamer-boy-ff-79de8-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"rg-gamer-boy-ff-79de8",storageBucket:"rg-gamer-boy-ff-79de8.firebasestorage.app",messagingSenderId:"699276161086",appId:"1:699276161086:web:38531927307cddcc08a16f",measurementId:"G-TRX2QKQFQF"};
const auth=getAuth(initializeApp(firebaseConfig));
await setPersistence(auth,browserLocalPersistence);
const $=id=>document.getElementById(id);
const asEmail=u=>u.trim().toLowerCase()+"@username.rggamerboyff.invalid";

function errorText(error){
  const messages={
    "auth/email-already-in-use":"This username is already taken.",
    "auth/weak-password":"Please use a password with 8–15 characters.",
    "auth/too-many-requests":"Too many attempts. Please try again later.",
    "auth/network-request-failed":"Network error. Check your internet connection.",
    "auth/invalid-api-key":"Firebase API key is invalid. Check the Firebase configuration.",
    "auth/operation-not-allowed":"Enable Email/Password sign-in in Firebase Authentication.",
    "auth/unauthorized-domain":"This website domain is not authorized in Firebase Authentication."
  };
  return messages[error.code]||("Account creation failed. Please check Firebase settings. ("+(error.code||"unknown error")+")");
}

function showWelcomeBack(){
  $("pageTitle").textContent="Welcome Back!";
  $("pageSubtitle").textContent="Your account is ready. Continue to the website.";
  $("authArea").classList.add("hidden");
  $("continueArea").classList.remove("hidden");
  $("message").textContent="";
}

onAuthStateChanged(auth,user=>{
  if(user) showWelcomeBack();
  else {
    $("pageTitle").textContent="Welcome";
    $("pageSubtitle").textContent="Create your account to continue.";
    $("authArea").classList.remove("hidden");
    $("continueArea").classList.add("hidden");
  }
});

$("authForm").addEventListener("submit",async event=>{
  event.preventDefault();
  $("message").textContent="";
  const username=$("username").value.trim();
  const password=$("password").value;
  const confirm=$("confirm").value;

  if(!/^[A-Za-z0-9_]{5,12}$/.test(username)){
    $("message").textContent="Username must be 5–12 characters (letters, numbers, or underscore).";
    return;
  }
  if(password.length<8||password.length>15){
    $("message").textContent="Password must be 8–15 characters.";
    return;
  }
  if(password!==confirm){
    $("message").textContent="Passwords do not match.";
    return;
  }

  const button=$("submitBtn");
  button.disabled=true;
  button.textContent="Creating Account...";
  try{
    await createUserWithEmailAndPassword(auth,asEmail(username),password);
    // Firebase's auth state listener switches the page to Welcome Back.
  }catch(error){
    $("message").textContent=errorText(error);
  }finally{
    button.disabled=false;
    button.textContent="Create Account";
  }
});

$("continueBtn").addEventListener("click",()=>location.href="index.html");
</script></body></html>
