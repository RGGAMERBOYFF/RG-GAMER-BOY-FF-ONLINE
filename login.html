<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RG GAMER BOY FF</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 15%,#34206c,transparent 38%),radial-gradient(circle at 85% 80%,#651c35,transparent 36%),#080b18;color:#fff;font-family:Arial,sans-serif}.card{width:min(100%,430px);padding:26px;border:1px solid #ffffff26;border-radius:22px;background:#101629ed;box-shadow:0 22px 70px #0009;text-align:center}.brandimg{width:140px;height:140px;max-width:55%;object-fit:contain;border-radius:18px;margin:0 auto 14px;display:block}h1{font-size:clamp(22px,6vw,30px);margin:8px 0;letter-spacing:1px}p{color:#b9c3dc;font-size:14px;line-height:1.5}input{width:100%;padding:14px;margin:8px 0;border:1px solid #394663;border-radius:10px;background:#080f20;color:#fff;font-size:16px;outline:none}.submit,.continue{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:linear-gradient(100deg,#7546ed,#d12e75);color:white;font-size:16px;font-weight:800;cursor:pointer}.small{font-size:12px;color:#98a6c5}.error{color:#ff8f9e;min-height:22px;font-size:13px}.hidden{display:none!important}.cf-turnstile{display:flex;justify-content:center;margin:16px 0}
</style></head><body><main class="card">
<img class="brandimg" src="https://i.supaimg.com/cc740f2b-876c-4dd7-bbf2-16d636413b82/85320e1a-9a75-4178-90bb-a7f01267a661.png" alt="RG GAMER BOY FF Official">
<h1>RG GAMER BOY FF</h1><p>Create your account to continue to the game.</p>
<section id="createArea"><form id="createForm">
<input id="username" autocomplete="username" minlength="5" maxlength="12" placeholder="Username (5–12 characters)" required>
<input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="15" placeholder="Password (8–15 characters)" required>
<input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="15" placeholder="Confirm Password" required>
<div class="cf-turnstile" data-sitekey="0x4AAAAAAFiituKybN0F5OD4" data-theme="dark"></div>
<button class="submit" id="createBtn" type="submit">Create Account</button></form>
<p class="small">Username: 5–12 characters. Password: 8–15 characters.</p></section>
<section id="welcomeArea" class="hidden"><p>Welcome Back!</p><button class="continue" id="continueBtn">Continue</button></section>
<div class="error" id="message" role="status"></div></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import{getAuth,setPersistence,browserLocalPersistence,createUserWithEmailAndPassword,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
const firebaseConfig={apiKey:"PASTE_NEW_FIREBASE_API_KEY",authDomain:"PASTE_NEW_FIREBASE_AUTH_DOMAIN",databaseURL:"PASTE_NEW_FIREBASE_DATABASE_URL",projectId:"PASTE_NEW_FIREBASE_PROJECT_ID",storageBucket:"PASTE_NEW_FIREBASE_STORAGE_BUCKET",messagingSenderId:"PASTE_NEW_FIREBASE_MESSAGING_SENDER_ID",appId:"PASTE_NEW_FIREBASE_APP_ID"};
const TURNSTILE_VERIFY_URL="https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev/verify";
const auth=getAuth(initializeApp(firebaseConfig));await setPersistence(auth,browserLocalPersistence);
const $=id=>document.getElementById(id);
const usernameEmail=u=>u.trim().toLowerCase()+"@username.rggamerboyff.invalid";
onAuthStateChanged(auth,user=>{$("createArea").classList.toggle("hidden",!!user);$("welcomeArea").classList.toggle("hidden",!user)});
$("createForm").addEventListener("submit",async e=>{
 e.preventDefault();$("message").textContent="";
 const u=$("username").value.trim(),p=$("password").value;
 if(!/^[A-Za-z0-9_]{5,12}$/.test(u))return $("message").textContent="Username must be 5–12 characters (letters, numbers, or underscore).";
 if(p.length<8||p.length>15)return $("message").textContent="Password must be 8–15 characters.";
 if(p!==$("confirm").value)return $("message").textContent="Passwords do not match.";
 const token=document.querySelector('[name="cf-turnstile-response"]')?.value;
 if(!token)return $("message").textContent="Please complete the security check.";
 $("createBtn").disabled=true;
 try{
  const check=await fetch(TURNSTILE_VERIFY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token})});
  const result=await check.json();
  if(!check.ok||result.success!==true)throw new Error("Security check failed. Please try again.");
  await createUserWithEmailAndPassword(auth,usernameEmail(u),p);
 }catch(err){$("message").textContent=err.code==="auth/email-already-in-use"?"This username is already taken.":err.message||"Account creation failed. Please try again."}
 finally{$("createBtn").disabled=false;if(window.turnstile)window.turnstile.reset();}
});
$("continueBtn").onclick=()=>location.href="index.html";
</script></body></html>
